workflows:
  telegram-build-workflow:
    name: Сборка Telegram клиента
    environment:
      vars:
        # Укажите точное имя файла или путь к нему
        BUILD_FILE_PATH: "build.gradle" # Например: "Telegram/build.gradle" или "Makefile"
    scripts:
      - name: Проверка логов Git и наличия файла сборки
        script: |
          #!/usr/bin/env bash
          set -e # Останавливает выполнение скрипта при любой ошибке
          
          echo "================================================="
          echo "🔍 Проверка логов Git (изменения в последнем коммите)"
          echo "================================================="
          
          # Проверяем, есть ли нужный файл в списке измененных файлов последнего коммита
          if git log -1 --name-only | grep -q "$BUILD_FILE_PATH"; then
              echo "✅ Файл сборки ($BUILD_FILE_PATH) был обновлен в этом коммите."
          else
              echo "ℹ️ Файл сборки ($BUILD_FILE_PATH) не изменялся в текущем коммите."
          fi

          echo "================================================="
          echo "📁 Проверка наличия файла в репозитории"
          echo "================================================="
          
          # Физическая проверка существования файла перед стартом сборки
          if [ -f "$BUILD_FILE_PATH" ]; then
              echo "✅ Файл сборки успешно найден. Подготовка к сборке..."
          else
              echo "❌ КРИТИЧЕСКАЯ ОШИБКА: Файл $BUILD_FILE_PATH не найден в скачанном с GitHub репозитории!"
              exit 1 # Команда exit 1 прервет пайплайн Codemagic
          fi

      - name: Запуск процесса сборки
        script: |
          #!/usr/bin/env bash
          echo "🚀 Начинаем сборку..."
          # Здесь размещаются ваши основные команды для сборки (например, ./gradlew assembleRelease)
          
    artifacts:
      - app/build/outputs/**/*.apk # Укажите путь к вашим готовым артефактам
      
