workflows:
  mytelegram-client:
    name: MyTelegram Client Build
    max_build_duration: 60
    environment:
      ndk: "21.4.7075529"
    scripts:
      - name: Fix NDK toolchain signature
        script: |
          NDK_BIN="/usr/local/share/android-sdk/ndk/21.4.7075529/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          sudo xattr -rd com.apple.quarantine "$NDK_BIN" || true
          sudo codesign --force --deep --sign - "$NDK_BIN"/* || true
      - name: Build APK
        script: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleDebug --stacktrace 2>&1 | tee build.log
    artifacts:
      - "**/*.apk"
      - build.log
