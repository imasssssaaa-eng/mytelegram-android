workflows:
  telegram-apk-builder:
    name: Сборка Telegram в APK
    instance_type: linux_x2 # Оптимальная виртуальная машина для сборки Android
    environment:
      java: 17 # Большинство современных клиентов Telegram требуют Java 11 или 17
      vars:
        BUILD_FILE_PATH: "build.gradle"
        APP_VERSION: "1.4.3.3"
    scripts:
      - name: Проверка логов Git и наличия файла сборки
        script: |
          #!/usr/bin/env bash
          set -e
          
          echo "🔍 Проверка изменений в $BUILD_FILE_PATH..."
          if git log -1 --name-only | grep -q "$BUILD_FILE_PATH"; then
              echo "✅ Файл сборки был изменен в последнем коммите."
          else
              echo "ℹ️ Файл сборки не изменялся, продолжаем..."
          fi
          
          if [ ! -f "$BUILD_FILE_PATH" ]; then
              echo "❌ ОШИБКА: Файл $BUILD_FILE_PATH не найден в корне проекта!"
              exit 1
          fi
          echo "✅ Файл найден. Переходим к сборке APK."

      - name: Подготовка локального окружения (Android SDK)
        script: |
          # Указываем путь к Android SDK для Gradle
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Сборка исходного кода в APK
        script: |
          #!/usr/bin/env bash
          
          # Выдаем права на выполнение скрипту gradle (обязательно для Linux/macOS)
          chmod +x gradlew
          
          echo "🚀 Начинаем компиляцию приложения (версия $APP_VERSION)..."
          
          # Команда сборки Release-версии APK. 
          # Параметр -PversionName передает версию внутрь сборки.
          ./gradlew assembleRelease -PversionName=$APP_VERSION
          
          echo "✅ Компиляция завершена!"

    artifacts:
      # Этот путь заставит Codemagic найти все созданные .apk файлы 
      # и прикрепить их к результатам сборки для скачивания.
      - app/build/outputs/apk/**/*.apk
    
    publishing:
      # По желанию можно настроить автоматическую отправку собранного APK в Telegram
      # telegram:
      #   bot_token: $TG_BOT_TOKEN
      #   chat_id: $TG_CHAT_ID
      
