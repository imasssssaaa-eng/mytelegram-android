workflows:
  mytelegram-client:
    name: MyTelegram Client Build
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference
      ndk_version: "25.2.9519653"
    scripts:
      - name: Build APK
        script: |
          set +e
          ./gradlew assembleRelease > build.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "===== ТОЛЬКО ОШИБКИ ====="
            grep -iE "error:|FAILED|error " build.log | sort -u
            echo "=========================="
            exit 1
          fi
          echo "Сборка прошла успешно"
    artifacts:
      - "**/*.apk"
      - build.log
