workflows:
  mytelegram-client:
    name: MyTelegram Client Build
    max_build_duration: 60
    environment:
      ndk: "21.4.7075529"
    scripts:
      - name: Build APK
        script: |
          set +e
          ./gradlew :TMessagesProj_App:assembleDebug > build.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "===== ТОЛЬКО ОШИБКИ ====="
            grep -E "^FAILED: |[0-9]+:[0-9]+: error:|fatal error:|undefined reference|ninja: build stopped" build.log | sort -u
            echo "=========================="
            exit 1
          fi
          echo "Сборка прошла успешно"
    artifacts:
      - "**/*.apk"
      - build.log
