workflows:
  android-build:
    name: Build MyTelegram Android Client
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      ndk: 25.2.9519653
      java: 17
    scripts:
      - name: Environment Diagnostics
        script: |
          echo "=== BUILD ENVIRONMENT LOGS ==="
          java -version
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"

      - name: Build APK with Extended Logging
        script: |
          echo "=== STARTING COMPILATION ==="
          ./gradlew assembleRelease --info --stacktrace

    artifacts:
      - TMessagesProj/build/outputs/apk/**/*.apk
      - build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your_email@example.com
        notify:
          failure: true
          success: true
