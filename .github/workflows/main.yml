# Вставить этот шаг в существующий .github/workflows/*.yml
# ПЕРЕД шагом сборки (./gradlew assembleRelease и т.п.)

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inject local auth stub (mytg.py)
        run: python3 mytg.py .
        # "." — потому что патчер запускается прямо из корня
        # клонированного репозитория mytelegram-android на CI-раннере

      - name: Build APK
        run: ./gradlew assembleRelease
